<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Outstanding SIP Manika 2026 - Gudang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #f1f5f9;
  --bg-grad: radial-gradient(circle at 15% 0%, rgba(13, 148, 136, 0.08), transparent 45%), radial-gradient(circle at 85% 10%, rgba(37, 99, 235, 0.06), transparent 45%);
  --card: #ffffff;
  --glass: rgba(255, 255, 255, 0.85);
  --ink: #0f172a;
  --mut: #64748b;
  --line: #e2e8f0;
  --acc: #0d9488;
  --acc-hover: #0f766e;
  --accink: #ffffff;
  --wa: #16a34a;
  --wa-hover: #15803d;
  --warn: #d97706;
  --danger: #ef4444;
  --ok: #10b981;
  --hl: #f8fafc;
  --inp: #ffffff;
  
  /* Warna Menyeluruh untuk Card & Baris (Sudah Datang & Sebagian) */
  --selesai-bg: #d1fae5;
  --selesai-hover: #a7f3d0;
  --selesai-border: #34d399;
  --selesai-ink: #064e3b;
  
  --sebagian-bg: #fef3c7;
  --sebagian-hover: #fde68a;
  --sebagian-border: #fbbf24;
  --sebagian-ink: #78350f;

  --shadow-sm: 0 1px 3px 0 rgba(15, 23, 42, 0.05);
  --shadow: 0 4px 14px -2px rgba(15, 23, 42, 0.07), 0 2px 6px -2px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 20px 38px -6px rgba(15, 23, 42, 0.14), 0 8px 16px -4px rgba(15, 23, 42, 0.06);
  --radius: 16px;
}

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #090d16;
    --bg-grad: radial-gradient(circle at 15% 0%, rgba(20, 184, 166, 0.12), transparent 45%), radial-gradient(circle at 85% 10%, rgba(59, 130, 246, 0.1), transparent 45%);
    --card: #111827;
    --glass: rgba(17, 24, 39, 0.85);
    --ink: #f8fafc;
    --mut: #94a3b8;
    --line: #1e293b;
    --acc: #14b8a6;
    --acc-hover: #2dd4bf;
    --accink: #042f2e;
    --wa: #22c55e;
    --wa-hover: #4ade80;
    --warn: #f59e0b;
    --danger: #f87171;
    --ok: #34d399;
    --hl: #1e293b;
    --inp: #0f172a;
    
    --selesai-bg: #0c3b2e;
    --selesai-hover: #114c3b;
    --selesai-border: #10b981;
    --selesai-ink: #ecfdf5;

    --sebagian-bg: #3d2807;
    --sebagian-hover: #4d3309;
    --sebagian-border: #f59e0b;
    --sebagian-ink: #fffbeb;

    --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.35);
    --shadow: 0 4px 14px -2px rgba(0, 0, 0, 0.5);
    --shadow-lg: 0 20px 38px -6px rgba(0, 0, 0, 0.7);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #090d16;
  --bg-grad: radial-gradient(circle at 15% 0%, rgba(20, 184, 166, 0.12), transparent 45%), radial-gradient(circle at 85% 10%, rgba(59, 130, 246, 0.1), transparent 45%);
  --card: #111827;
  --glass: rgba(17, 24, 39, 0.85);
  --ink: #f8fafc;
  --mut: #94a3b8;
  --line: #1e293b;
  --acc: #14b8a6;
  --acc-hover: #2dd4bf;
  --accink: #042f2e;
  --wa: #22c55e;
  --wa-hover: #4ade80;
  --warn: #f59e0b;
  --danger: #f87171;
  --ok: #34d399;
  --hl: #1e293b;
  --inp: #0f172a;

  --selesai-bg: #0c3b2e;
  --selesai-hover: #114c3b;
  --selesai-border: #10b981;
  --selesai-ink: #ecfdf5;

  --sebagian-bg: #3d2807;
  --sebagian-hover: #4d3309;
  --sebagian-border: #f59e0b;
  --sebagian-ink: #fffbeb;

  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.35);
  --shadow: 0 4px 14px -2px rgba(0, 0, 0, 0.5);
  --shadow-lg: 0 20px 38px -6px rgba(0, 0, 0, 0.7);
}

*, *::before, *::after {
  box-sizing: inherit;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background-color: var(--bg);
  background-image: var(--bg-grad);
  background-attachment: fixed;
  color: var(--ink);
  font: 14px/1.5 "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.wrap {
  max-width: 1400px;
  margin: 0 auto;
  padding: 20px 24px 56px;
  position: relative;
}

/* Navigasi Atas Ringkas & Sederhana */
header {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 14px;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  padding: 10px 14px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: var(--shadow-sm);
}

.brand-info {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
}

h1 {
  margin: 0;
  font-size: 17px;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.2;
}

.sub {
  color: var(--mut);
  font-size: 11.5px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.hact {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
}

.hact .sm {
  padding: 5px 10px;
  font-size: 12px;
  min-height: 32px;
  border-radius: 8px;
}

#th {
  width: 32px !important;
  height: 32px !important;
  min-height: 32px !important;
  border-radius: 8px;
}

/* Controls & Buttons */
button, .btn, select, input {
  font: inherit;
  color: var(--ink);
  transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
}

button, .btn {
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: 11px;
  padding: 8px 14px;
  font-weight: 600;
  font-size: 13.5px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  text-decoration: none;
  box-shadow: var(--shadow-sm);
}

button:hover:not(:disabled), .btn:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow);
  border-color: var(--mut);
}

button:active:not(:disabled), .btn:active {
  transform: translateY(0);
}

.primary {
  background: var(--acc);
  color: var(--accink);
  border-color: transparent;
  font-weight: 700;
}

.primary:hover:not(:disabled) {
  background: var(--acc-hover);
  border-color: transparent;
}

input, select {
  background: var(--inp);
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 9px 13px;
  min-width: 0;
  font-size: 13.5px;
  font-weight: 500;
  box-shadow: var(--shadow-sm);
}

button:focus, button:focus-visible, .bento-card:focus, .bento-card:focus-visible, tr:focus, .dmc:focus {
  outline: none;
}

input:focus-visible, select:focus-visible {
  outline: none;
  border-color: var(--acc);
  box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.22);
}

/* 4 Metric Cards Modern dengan Ikon Cantik (Tanpa Progress Bar) */
.bento-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 14px;
}

.bento-card {
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  padding: 14px 16px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 14px;
  position: relative;
  overflow: hidden;
  transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
}

.bento-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}

.bento-card.active {
  border-color: var(--acc);
  box-shadow: 0 0 0 2px rgba(13, 148, 136, 0.25), var(--shadow-sm);
}

/* Warna menyeluruh pada Metric Card Sebagian & Selesai */
.bento-card.bento-sebagian {
  background-color: var(--sebagian-bg);
  border-color: var(--sebagian-border);
  color: var(--sebagian-ink);
}

.bento-card.bento-selesai {
  background-color: var(--selesai-bg);
  border-color: var(--selesai-border);
  color: var(--selesai-ink);
}

.bento-ic {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}

.ic-all {
  background: rgba(13, 148, 136, 0.12);
  color: var(--acc);
}

.ic-belum {
  background: rgba(100, 116, 139, 0.14);
  color: var(--mut);
}

.ic-sebagian {
  background: rgba(245, 158, 11, 0.22);
  color: #d97706;
}
:root[data-theme="dark"] .ic-sebagian {
  background: rgba(245, 158, 11, 0.25);
  color: #fbbf24;
}

.ic-selesai {
  background: rgba(16, 185, 129, 0.22);
  color: #059669;
}
:root[data-theme="dark"] .ic-selesai {
  background: rgba(16, 185, 129, 0.25);
  color: #34d399;
}

.bento-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.bento-label {
  font-size: 11.5px;
  font-weight: 700;
  color: var(--mut);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.bento-card.bento-sebagian .bento-label,
.bento-card.bento-selesai .bento-label {
  color: currentColor;
  opacity: 0.8;
}

.bento-num {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.15;
}

/* Command Bar & Segmented Filter */
.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  padding: 12px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: var(--shadow-sm);
}

.search-box {
  position: relative;
  flex: 1 1 300px;
  display: flex;
  align-items: center;
}

.search-box svg {
  position: absolute;
  left: 13px;
  color: var(--mut);
  pointer-events: none;
}

.search-box input {
  width: 100%;
  padding-left: 38px;
  padding-right: 36px;
}

.kbd-hint {
  position: absolute;
  right: 10px;
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  font-weight: 600;
  color: var(--mut);
  background: var(--hl);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 1px 6px;
  pointer-events: none;
}

.filter-selects {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

#stats { display: none; }

/* Enterprise Data Table */
.tw {
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--card);
  box-shadow: var(--shadow);
}

table {
  border-collapse: separate;
  border-spacing: 0;
  width: 100%;
  min-width: 1020px;
}

th, td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: middle;
}

th {
  background: var(--hl);
  color: var(--mut);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  white-space: nowrap;
  position: sticky;
  top: 0;
  z-index: 10;
}

tbody tr {
  transition: background-color 0.15s ease;
}

tbody tr:last-child td {
  border-bottom: 0;
}

tbody tr:hover td {
  background-color: rgba(148, 163, 184, 0.08);
}

td.r, th.r {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

td.spec {
  min-width: 260px;
  font-weight: 700;
  color: var(--ink);
}

/* WARNA MENYELURUH PADA BARIS TABEL & CARD (SUDAH DATANG & SEBAGIAN) */
tr.row-selesai,
tr.row-selesai td {
  background-color: var(--selesai-bg) !important;
  border-bottom-color: var(--selesai-border);
}

tr.row-selesai:hover td {
  background-color: var(--selesai-hover) !important;
}

tr.row-sebagian,
tr.row-sebagian td {
  background-color: var(--sebagian-bg) !important;
  border-bottom-color: var(--sebagian-border);
}

tr.row-sebagian:hover td {
  background-color: var(--sebagian-hover) !important;
}

/* Monospace Pill & Avatar Pemesan */
.mono-tag {
  font-family: "JetBrains Mono", monospace;
  font-size: 11.5px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 6px;
  background: rgba(15, 23, 42, 0.07);
  border: 1px solid rgba(15, 23, 42, 0.14);
  display: inline-block;
  white-space: nowrap;
}

:root[data-theme="dark"] .mono-tag {
  background: rgba(255, 255, 255, 0.1);
  border-color: rgba(255, 255, 255, 0.18);
}

.pem-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-weight: 600;
  font-size: 13px;
}

.pem-av {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: inline-grid;
  place-items: center;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
}

/* Progress Bar di Kolom Jumlah Datang */
.prog-cell {
  display: inline-flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  min-width: 110px; white-space: nowrap;
}

.prog-track {
  width: 100%;
  height: 5px;
  background: rgba(15, 23, 42, 0.14);
  border-radius: 99px;
  overflow: hidden;
}

:root[data-theme="dark"] .prog-track {
  background: rgba(255, 255, 255, 0.18);
}

.prog-fill {
  height: 100%;
  border-radius: 99px;
}

/* Status Badges */
.b {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11.5px;
  font-weight: 700;
  white-space: nowrap;
  padding: 4px 11px;
  border-radius: 999px;
}

.b.belum {
  background: var(--hl);
  color: var(--mut);
  border: 1px solid var(--line);
}

.b.sebagian {
  background: #f59e0b;
  color: #ffffff;
}

.b.selesai {
  background: #059669;
  color: #ffffff;
}

/* Pager */
.pager {
  display: flex;
  gap: 12px;
  align-items: center;
  justify-content: center;
  margin: 22px 0 8px;
  color: var(--mut);
  font-size: 13.5px;
  font-weight: 600;
}

.ac { white-space: nowrap; }
.sm { padding: 6px 12px; font-size: 12.5px; border-radius: 9px; }

button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none !important;
  box-shadow: none !important;
}

#msg {
  color: var(--warn);
  font-size: 13.5px;
  font-weight: 600;
  margin: 8px 4px;
}

/* Header Buttons Styling */
.cnt {
  display: inline-block;
  min-width: 20px;
  padding: 1px 7px;
  margin-left: 3px;
  border-radius: 999px;
  background: var(--wa);
  color: #fff;
  font-size: 11.5px;
  font-weight: 700;
  text-align: center;
}
.cnt[hidden] { display: none; }

#wm {
  background: var(--wa);
  color: #fff;
  border-color: transparent;
}
#wm:hover { background: var(--wa-hover); }
#wm .cnt { background: #fff; color: var(--wa); }

#dm {
  background: #2563eb;
  color: #fff;
  border-color: transparent;
}
#dm:hover { background: #1d4ed8; }
#dm .cnt { background: #fff; color: #2563eb; }

#th {
  width: 38px;
  height: 38px;
  padding: 0;
  border-radius: 10px;
}

#me {
  background: rgba(239, 68, 68, 0.12);
  color: var(--danger);
  border-color: rgba(239, 68, 68, 0.28);
}
#me:hover {
  background: var(--danger);
  color: #fff;
}
#me[hidden] { display: none; }

.wasent {
  background: #2563eb;
  color: #fff;
  border-color: #1d4ed8;
}

.wa {
  background: var(--wa);
  color: #fff;
  border-color: transparent;
}
.wa:hover:not(:disabled) { background: var(--wa-hover); }
.wa.off { opacity: 0.5; pointer-events: none; }

.by {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  padding: 1px 8px;
  border-radius: 999px;
  background: rgba(15, 23, 42, 0.1);
  color: var(--ink);
  margin-left: 4px;
}
:root[data-theme="dark"] .by {
  background: rgba(255, 255, 255, 0.15);
}

/* Slide-Over Drawers (Pesan WA & Stok Material Gudang) */
#panel:not([hidden]), #dmp:not([hidden]) {
  position: fixed;
  inset: 0;
  z-index: 45;
  background: rgba(15, 23, 42, 0.55);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  display: flex;
  justify-content: flex-end;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  animation: fadeIn 0.2s ease;
}

.drawer-shell {
  width: min(680px, 100%);
  height: 100%;
  background: var(--bg);
  border-left: 1px solid var(--line);
  box-shadow: var(--shadow-lg);
  overflow-y: auto;
  padding: 0 20px calc(28px + env(safe-area-inset-bottom, 0px));
  animation: slideLeft 0.24s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes slideLeft {
  from { transform: translateX(100%); }
  to { transform: translateX(0); }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.ph {
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--glass);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: flex;
  gap: 10px;
  align-items: center;
  margin: 0 -20px 16px;
  padding: calc(16px + env(safe-area-inset-top, 0px)) 20px 14px;
  border-bottom: 1px solid var(--line);
  font-size: 17px;
}

.ph span { color: var(--mut); font-size: 13px; font-weight: 500; }

.grp {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-sm);
}

.gh {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.gh h3 { margin: 0; font-size: 16px; font-weight: 700; }
.gh label { font-size: 13px; font-weight: 600; color: var(--mut); display: flex; gap: 8px; align-items: center; }

.it {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  margin-bottom: 8px;
  padding: 10px 12px;
  background: var(--hl);
  border-radius: 10px;
}
.it .n { width: 24px; color: var(--mut); font-weight: 700; }
.ro { flex: 1 1 220px; font-size: 13.5px; }
.x { padding: 4px 10px; line-height: 1; font-size: 16px; border-radius: 8px; color: var(--mut); }
.x:hover { background: var(--danger); color: #fff; border-color: var(--danger); }

.prev {
  white-space: pre-wrap;
  background: var(--hl);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px;
  margin: 10px 0 12px;
  font: 12.5px/1.6 "JetBrains Mono", monospace;
}

.act { display: flex; gap: 8px; flex-wrap: wrap; }

/* Daftar Material Cards - Warna Menyeluruh untuk Card Sudah Datang & Sebagian */
#dmp .dmf { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
#dmp #dmq { flex: 1 1 100%; font-size: 15px; padding: 11px 14px; }
#dmp #dmsel, #dmp #dmwa { flex: 1; font-size: 14px; padding: 10px 12px; }
#dmp .dmtabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  margin: 12px 0 16px;
  padding: 5px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
}
#dmp .dmtabs button {
  border: 0;
  background: none;
  padding: 10px 8px;
  font-weight: 700;
  font-size: 13.5px;
  border-radius: 10px;
  color: var(--mut);
  box-shadow: none;
}
#dmp .dmtabs button.on {

let dmOpen=false,dmBelum='',dmPem='',dmQ='',dmAsk=null,dmTab='in';
function dmOk(r){return (!dmPem||r.pem===dmPem)&&(!dmBelum||dmTab==='out'||(dmBelum==='belum')!==isSent(r))&&dmQ.toLowerCase().split(/\s+/).filter(Boolean).every(t=>r.hay.includes(t))}
let dmNew=new Map(),dmOut=new Map();
function updDc(){const c=$('#dc');if(!c)return;const n=dmEntries('in',true).length;c.textContent=n;c.hidden=!n}
const dmKey=(id,s)=>id+'|'+(s.tgl||'')+'|'+s.jml;
function dmStages(r){const a=vst(r).map(s=>({tgl:s.tgl||'',jml:s.jml,by:s.by||''}));if(r.stg&&r.base>0)a.unshift({tgl:'',jml:r.base,by:''});return a}
function dmK(map,s){if(map.has(s))return s;const n=+s;return map.has(n)?n:null}
function dmUsed(id,tgl,sj){let n=0;dmOut.forEach(v=>{if(v&&typeof v==='object'&&!Array.isArray(v)&&v.id===id&&v.tgl===tgl&&rnd(v.sj==null?v.jml:v.sj)===rnd(sj))n+=v.jml});return rnd(n)}
function dmEntries(tab,all){
  const res=[],seen=new Set();
  (tab==='out'?dmOut:dmNew).forEach((v,k)=>{
    if(typeof k==='number'){
      const spec=tab==='out'?v[0]:v,r=R.get(k);
      if(!r||r.jml===null||r.spec!==spec)return;
      if(tab==='out'){res.push({key:k,r,tgl:r.dtg||'',jml:r.cur,out:v[1],whole:true});return}
      dmStages(r).forEach(s=>{const key=dmKey(r.id,s),rem=rnd(s.jml-dmUsed(r.id,s.tgl,s.jml));if(rem<=1e-9||seen.has(key))return;seen.add(key);res.push({key,r,tgl:s.tgl,jml:rem,sj:s.jml,by:s.by})});
      return;
    }
    const r=R.get(v.id);
    if(!r||r.jml===null||r.spec!==v.spec)return;
    if(tab==='out'){res.push({key:k,r,tgl:v.tgl,jml:v.jml,sj:v.sj==null?v.jml:v.sj,by:v.by,out:v.out,spk:v.spk||''});return}
    if(!dmStages(r).some(s=>s.tgl===v.tgl&&s.jml===v.jml)||seen.has(k))return;
    const rem=rnd(v.jml-dmUsed(v.id,v.tgl,v.jml));if(rem<=1e-9)return;
    seen.add(k);res.push({key:k,r,tgl:v.tgl,jml:rem,sj:v.jml,by:v.by});
  });
  const first=new Map();res.forEach((e,i)=>{if(!first.has(e.r.id))first.set(e.r.id,i)});
  res.sort((a,b)=>first.get(a.r.id)-first.get(b.r.id)||(a.tgl<b.tgl?-1:a.tgl>b.tgl?1:0));
  return all?res:res.filter(e=>dmOk(e.r));
}

  h+=`<div class="dmf"><select id="dmsel" aria-label="Pemesan"><option value="">Semua pemesan</option>${names.map(n=>`<option${n===dmPem?' selected':''}>${esc(n)}</option>`).join('')}</select></div>`;
  if(dmTab==='in'){const w=dmEntries('in',true).filter(e=>e.r.jml!==null),nb=w.filter(e=>!isSent(e.r)).length,ns=w.length-nb;h+=`<div class="dmf"><select id="dmwa" aria-label="Status WA"><option value="">Semua status WA</option><option value="belum"${dmBelum==='belum'?' selected':''}>WA belum dikirim (${nb})</option><option value="sudah"${dmBelum==='sudah'?' selected':''}>WA sudah dikirim (${ns})</option></select></div>`}
  h+=`<div class="dmtabs"><button class="${dmTab==='in'?'on':''}" data-tab="in">Di Gudang (${dmCnt('in')})</button><button class="${dmTab==='out'?'on':''}" data-tab="out">Barang Keluar (${dmCnt('out')})</button></div>`;
  if(!list.length)h+=(dmQ||dmPem||(dmBelum&&dmTab==='in'))&&dmEntries(dmTab,true).length?'<div class="note" style="text-align:center;padding:32px">Tidak ada barang yang cocok dengan pencarian.</div>':dmTab==='out'?'<div class="note" style="text-align:center;padding:32px">Belum ada barang yang dikeluarkan.</div>':'<div class="note" style="text-align:center;padding:32px">Daftar masih kosong. Barang yang baru Anda input akan muncul di sini.</div>';
  Object.entries(g).forEach(([pem,a])=>{
    h+=`<div class="grp"><div class="gh"><h3>Pemesan: ${esc(pem)}</h3><span class="note">${a.length} barang</span></div>`+
    a.map(dmCard).join('')+'</div>';
  });
  h+='</div>';
  if(dmAsk!==null){const ae=dmEntries('in',true).find(x=>x.key===dmAsk);h+=`<div class="dmmod" id="dmmod" role="dialog" aria-modal="true" aria-labelledby="dmmt"><div class="dmbox"><h3 id="dmmt">Keluarkan barang</h3>${ae?`<div class="dmnm">${esc(ae.r.spec)}</div><div class="note">Jumlah ${esc(rnd(ae.jml))} ${esc(ae.r.sat)}${ae.tgl?', datang tgl '+esc(fmtD(ae.tgl)):''}</div>`:''}<label>Jumlah dikeluarkan (${esc(ae.r.sat)}, maks ${esc(rnd(ae.jml))})<input type="number" id="dmjl" min="0" max="${esc(ae.jml)}" step="any" inputmode="decimal" value="${esc(rnd(ae.jml))}"></label>${isStk(ae.r.spk)?`<label>Pilih SPK tujuan<select id="dmspk" style="width:100%;font-size:16px;padding:12px"><option value="">Pilih no. SPK</option>${dmSpkList().map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></label>`:''}<label>Tanggal dikeluarkan<input type="date" id="dmtg" value="${todayIso()}"></label><div class="note" id="dmte" style="color:var(--warn)"></div><div class="dmbb"><button class="sm primary" data-ok="${esc(dmAsk)}">Simpan</button><button class="sm" data-no="1">Batal</button></div></div></div>`}
  const oldSh=p.querySelector('.drawer-shell'),oldTop=oldSh?oldSh.scrollTop:0;
  p.innerHTML=h;
  {const ns=p.querySelector('.drawer-shell');if(ns&&oldSh){ns.style.animation='none';ns.scrollTop=oldTop}}
  if(dmAsk!==null){const i=$('#dmjl')||$('#dmtg');if(i){i.focus();try{i.select()}catch(x){}}}
}
$('#dm').onclick=()=>{dmOpen=!dmOpen;renderDm()};
const p0=()=>document.querySelector('#dmp .drawer-shell');
$('#dmp').addEventListener('click',e=>{
  const t=e.target;
  if(t.id==='dmp'||t.id==='dmcl'){dmOpen=false;renderDm()}
  else if(t.dataset.tab){dmTab=t.dataset.tab;dmAsk=null;renderDm();const sh=p0();if(sh)sh.scrollTop=0}
  else if(t.dataset.out!==undefined){dmAsk=t.dataset.out;renderDm()}
  else if(t.dataset.no){dmAsk=null;renderDm()}
  else if(t.id==='dmmod'){dmAsk=null;renderDm()}
  else if(t.dataset.ok!==undefined){const ae=dmEntries('in',true).find(x=>x.key===t.dataset.ok),qv=num2(($('#dmjl')||{}).value),mm=$('#dmte');
    if(ae&&(qv===null||qv<=0)){if(mm)mm.textContent='Isi jumlah dikeluarkan lebih dari 0.';const j=$('#dmjl');if(j)j.focus();return}
    if(ae&&qv>ae.jml+1e-9){if(mm)mm.textContent='Jumlah melebihi yang ada. Maksimal '+rnd(ae.jml)+' '+ae.r.sat+'.';const j=$('#dmjl');if(j)j.focus();return}
    let spk='';if(ae&&isStk(ae.r.spk)){const sv=(($('#dmspk')||{}).value||'').trim();if(!sv||!dmSpkList().includes(sv)){if(mm)mm.textContent='Pilih SPK tujuan dari daftar.';const k=$('#dmspk');if(k)k.focus();return}spk=sv}
    const v=($('#dmtg')||{}).value,iso=isoRe.test(v||'')?v:'';if(!iso){const m=$('#dmte');if(m)m.textContent='Pilih tanggal dulu dari kalender.';const i=$('#dmtg');if(i)i.focus();return}dmKeluar(t.dataset.ok,iso,qv,spk)}
  else if(t.dataset.back!==undefined)dmBalik(t.dataset.back);
  else if(t.dataset.wa!==undefined)addSel(+t.dataset.wa)
});
$('#dmp').addEventListener('change',e=>{if(e.target.id==='dmsel'){dmPem=e.target.value;dmAsk=null;renderDm()}else if(e.target.id==='dmwa'){dmBelum=e.target.value;dmAsk=null;renderDm()}});
$('#dmp').addEventListener('input',e=>{if(e.target.id==='dmq'){dmQ=e.target.value;dmAsk=null;renderDm();const q=$('#dmq');if(q){q.focus();const n=q.value.length;try{q.setSelectionRange(n,n)}catch(x){}}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&dmOpen&&pk.hidden){if(dmAsk!==null)dmAsk=null;else dmOpen=false;renderDm()}});

/* Tombol back HP */
let hd=0,hSkip=false;
const ovN=()=>(dmOpen?1:0)+(dmAsk!==null?1:0)+(panelOpen?1:0)+(editing!==null?1:0);
function syncHist(){const n=ovN();while(hd<n){history.pushState({ov:++hd},'')}if(hd>n){const d=hd-n;hd=n;hSkip=true;history.go(-d)}}
{const a=renderTable;renderTable=function(){a.apply(this,arguments);syncHist()};
const b=renderDm;renderDm=function(){b.apply(this,arguments);syncHist()};
const c=renderPanel;renderPanel=function(){c.apply(this,arguments);syncHist()}}
window.addEventListener('popstate',()=>{
  if(hSkip){hSkip=false;return}
  hd=Math.max(0,hd-1);
  if(editing!==null){editing=null;renderTable()}
  else if(panelOpen){panelOpen=false;renderPanel()}
  else if(dmAsk!==null){dmAsk=null;renderDm()}
  else if(dmOpen){dmOpen=false;renderDm()}
  syncHist();
});

/* Push Notification */
const NT_APP='manika',NT_LBL='SIP Manika',NT_PUB='BIfmBSe5xsdy6SCUtIKRH30nIp4FZpMtwHXIMOup7H_xH261QCSSF-ajHmbvk2xTZfXF956YZlbhbeDUEmKhLtc',NT_FN=SB_URL+'/functions/v1/push';
const ntB64=s=>{const r=(s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'),a=atob(r);return Uint8Array.from(a,c=>c.charCodeAt(0))};
const ntOk=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
async function ntCall(b){const r=await fetch(NT_FN,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(Object.assign({app:NT_APP,tok},b))});return r.json().catch(()=>({}))}
async function ntReg(){const reg=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready;return reg}
async function ntSub(){
  const reg=await ntReg();let s=await reg.pushManager.getSubscription();
  if(!s)s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:ntB64(NT_PUB)});
  await ntCall({action:'subscribe',sub:s.toJSON()});
  try{localStorage.setItem('nt2','1')}catch(x){}
}
function ntInit(){
  if(!ntOk())return;
  const go=()=>ntSub().catch(()=>{});
  if(Notification.permission==='granted'){go();return}
  if(Notification.permission==='default'){
    const ask=async()=>{
      document.removeEventListener('click',ask,true);document.removeEventListener('touchend',ask,true);
      try{if(await Notification.requestPermission()==='granted')go()}catch(x){}
    };
    document.addEventListener('click',ask,true);document.addEventListener('touchend',ask,true);
  }
}
function ntSend(title,body){
  if(!tok||!ntOk())return;
  (async()=>{try{const reg=await navigator.serviceWorker.getRegistration(),s=reg&&await reg.pushManager.getSubscription();
    await ntCall({action:'notify',own:s?s.endpoint:'',title:title+' - '+NT_LBL,body})}catch(x){}})();
}

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&(e.target.id==='dmtg'||e.target.id==='dmjl')){const b=document.querySelector('#dmmod [data-ok]');if(b)b.click()}});
</script>
